version: '3.8'
services:
  # La base de données
  db:
    image: postgres:15-alpine
    container_name: todo_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Ton application
  api:
    build: 
      context: .
      dockerfile: src\Todo.Api\Dockerfile
    container_name: Todo.Api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=todo_db;Username=admin;Password=password123"

volumes:
  postgres_data: